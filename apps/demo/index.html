<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The theme picked on the site, restored before the page paints. Same script as apps/site/vite.config.ts. -->
    <script>try{var r=document.documentElement,k='creance-theme',t=localStorage.getItem(k);if(t==='light'||t==='dark')r.dataset.theme=t;new MutationObserver(function(){r.dataset.theme?localStorage.setItem(k,r.dataset.theme):localStorage.removeItem(k)}).observe(r,{attributeFilter:['data-theme']})}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Creance demo: supervising a simulated AI agent as it fixes a failing deploy." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Creance demo: supervising an agent run</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
