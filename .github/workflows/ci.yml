name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run, and so a deploy, be started by hand from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, unit tests, bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @creance-ui/react test
      - run: pnpm --filter ai-sdk-example test
      - run: pnpm --filter @creance-ui/tokens test
      - run: pnpm --filter @creance-ui/react size

  react-18:
    name: Unit tests on React 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Installs React 18 for the run, then restores the lockfile.
      - run: pnpm test:react18

  storybook-a11y:
    name: Axe on every story (light and dark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter docs exec playwright install --with-deps chromium
      - run: pnpm --filter docs test

  visual-and-e2e:
    name: Visual regression, demo end-to-end, Next.js and the site
    runs-on: ubuntu-latest
    # The same image the baselines were generated in (scripts/visual-docker.sh), so rendering matches.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build-storybook
      - run: pnpm --filter demo build
      - run: pnpm exec playwright test
      # Next.js App Router: server rendering, hydration and interaction for all 109 components.
      - run: pnpm test:next
      # The site: every guide and every component example renders, and examples can be edited.
      - run: pnpm test:site
      - run: pnpm test:ai-sdk
      # The shadcn registry: its items check out, and installing some into a fresh shadcn project builds and works.
      - run: pnpm --filter site test
      - run: pnpm test:registry
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  release-dry-run:
    name: Changesets status and publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lists pending changesets and the version bumps they would make.
      - run: pnpm changeset status
      # Builds and packs both packages exactly as `npm publish` would, without publishing.
      - run: pnpm release:dry-run

  deploy:
    name: Deploy the site, Storybook and demo to Cloudflare Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks, react-18, storybook-a11y, visual-and-e2e, release-dry-run]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Repository secrets. The token needs the "Cloudflare Pages: Edit" account permission.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: creance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build-storybook
      # A relative base, so the demo works at a domain root and under a path alike.
      - run: pnpm --filter demo build
        env:
          DEMO_BASE: ./
      - run: pnpm --filter site build
      # The site at the root (its example apps at /examples/, the shadcn registry at /r/), Storybook at /storybook/, the demo at /demo/.
      - run: |
          mkdir site
          cp -r apps/site/dist/. site/
          cp -r apps/docs/storybook-static site/storybook
          cp -r apps/demo/dist site/demo
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Built but not deployed. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy."
      # Creating the project fails harmlessly once it exists; a real problem shows up in the deploy.
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          pnpm dlx wrangler@4 pages project create "$PROJECT" --production-branch=main || true
          pnpm dlx wrangler@4 pages deploy site --project-name="$PROJECT" --branch=main --commit-dirty=true
