name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, unit tests, bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter creance test
      - run: pnpm --filter creance size

  react-18:
    name: Unit tests on React 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Installs React 18 for the run, then restores the lockfile.
      - run: pnpm test:react18

  storybook-a11y:
    name: Axe on every story (light and dark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter docs exec playwright install --with-deps chromium
      - run: pnpm --filter docs test

  visual-and-e2e:
    name: Visual regression, demo end-to-end and Next.js
    runs-on: ubuntu-latest
    # The same image the baselines were generated in (scripts/visual-docker.sh), so rendering matches.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build-storybook
      - run: pnpm --filter demo build
      - run: pnpm exec playwright test
      # Next.js App Router: server rendering, hydration and interaction for all 90 components.
      - run: pnpm test:next
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  release-dry-run:
    name: Changesets status and publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lists pending changesets and the version bumps they would make.
      - run: pnpm changeset status
      # Builds and packs both packages exactly as `npm publish` would, without publishing.
      - run: pnpm release:dry-run

  pages:
    name: Deploy Storybook and demo to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, storybook-a11y, visual-and-e2e, release-dry-run]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build-storybook
      - run: pnpm --filter demo build
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/demo/
      # Storybook at the site root, the demo at /demo/.
      - run: |
          mkdir site
          cp -r apps/docs/storybook-static/. site/
          cp -r apps/demo/dist site/demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
